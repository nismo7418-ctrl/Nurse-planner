# Thème de l'application (appliqué automatiquement par `streamlit run app.py`).
# Identité visuelle : « carnet d'agenda papier » — crème, rose poudré, mauve.
# Les finitions (papier pointé, scotch washi, polices manuscrites, tactiles)
# sont injectées par `inject_theme_css()` dans `app.py`.

[theme]
base = "light"
primaryColor = "#c15b8a"            # rose candy (boutons, liens, accents)
backgroundColor = "#fdf6f1"         # papier crème
secondaryBackgroundColor = "#fbeef2"  # rose poudré (champs / panneaux)
textColor = "#4a3640"              # aubergine douce (lisible sur crème)
font = "sans serif"

[browser]
gatherUsageStats = false
