[project]
name = "nurse-planner"
version = "1.3.0"
description = "Application de gestion infirmière à domicile (La Louvière, Wallonie) : patients, interventions, agenda, facturation et localisation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.49.0",
    "pandas>=2.0.0",
    "folium>=0.15.0",
    "streamlit-folium>=0.18.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]  # lignes longues (chaînes SQL, libellés) : gérées par convention

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
